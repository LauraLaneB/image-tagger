<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>image-tagger</title>

  <style>
   body {
  font-family: Arial;
  text-align: center;
  padding: 10px;
}

img {
  max-width: 70%;
  max-height: 250px;
  height: auto;
  object-fit: contain;
  margin-bottom: 15px;
}

    .hidden { display: none; }
#inputs {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

#inputs input {
  width: 45%;   /* 👈 2 par ligne */
  padding: 10px;
  box-sizing: border-box;
}    button { padding: 10px; margin: 5px; }
  
input {
  font-size: 16px; /* évite zoom iPhone automatique */
}
</style>
</head>

<body>

<h2>Qui vois-tu sur cette image ?</h2>

<img id="image" />

<div id="step2">
  <p>Combien de personnages vois-tu ?</p>
  <input type="number" id="count" min="1" />
  <button onclick="generateInputs()">Valider</button>
</div>

<div id="inputs"></div>

<button onclick="submitTags()">Envoyer</button>
<script>

let currentImage = null;

const characters = [
  "Mickey", "Minnie", "Donald", "Daisy",
  "Cendrillon", "Elsa", "Anna", "Buzz Lightyear"
];

// 🔄 charger image
fetch("/random-image")
  .then(r => r.json())
  .then(data => {
    currentImage = data;
    document.getElementById("image").src = data.url;
  });

function nextStep() {
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

function generateInputs() {
  const count = document.getElementById("count").value;
  const container = document.getElementById("inputs");

  container.innerHTML = "";

  for (let i = 0; i < count; i++) {
    const wrapper = document.createElement("div");
    wrapper.style.margin = "10px";

    const input = document.createElement("input");
    input.placeholder = "Personnage " + (i + 1);

    const skipBtn = document.createElement("button");
    skipBtn.innerText = "Je ne sais pas";
    skipBtn.onclick = () => {
      input.value = "INCONNU";
      input.disabled = true;
    };

    wrapper.appendChild(input);
    wrapper.appendChild(skipBtn);

    container.appendChild(wrapper);
  }


  document.getElementById("step2").classList.add("hidden");

}

// 🔎 autocomplete simple
function showSuggestions(input) {
  const value = input.value.toLowerCase();

  const match = characters.filter(c =>
    c.toLowerCase().startsWith(value)
  );

  console.log(match); // simple debug (améliorable UI)
}

function submitTags() {
  const inputs = document.querySelectorAll("#inputs input");

  let tags = [];

  inputs.forEach(i => {
    if (i.value.trim() !== "") {
      tags.push(i.value.trim());
    }
  });

  fetch("/tag", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      image_id: currentImage.id,
      tags: tags.join(";")
    })
  }).then(() => {
    location.reload(); // 👈 passe direct à l’image suivante
  });
}

</script>

</body>
</html>
