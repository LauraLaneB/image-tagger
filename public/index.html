<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tagger Disney</title>

  <style>
    body { font-family: Arial; text-align: center; }
    img { max-width: 300px; margin: 10px; }
    .hidden { display: none; }
    input { margin: 5px; padding: 8px; }
    button { padding: 10px; margin: 5px; }
  </style>
</head>

<body>

<h2>Qui vois-tu sur cette image ?</h2>

<div id="step1">
  <img id="image" />
  <br>
  <button onclick="nextStep()">Commencer</button>
</div>

<div id="step2" class="hidden">
  <p>Combien de personnages vois-tu ?</p>
  <input type="number" id="count" min="1" />
  <button onclick="generateInputs()">Valider</button>
</div>

<div id="step3" class="hidden">
  <div id="inputs"></div>
  <button onclick="submitTags()">Envoyer</button>
</div>

<script>

let currentImage = null;

const characters = [
  "Mickey", "Minnie", "Donald", "Daisy",
  "Cendrillon", "Elsa", "Anna", "Buzz Lightyear"
];

// 🔄 charger image
fetch("/random-image")
  .then(r => r.json())
  .then(data => {
    currentImage = data;
    document.getElementById("image").src = data.url;
  });

function nextStep() {
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

function generateInputs() {
  const count = document.getElementById("count").value;
  const container = document.getElementById("inputs");

  container.innerHTML = "";

  for (let i = 0; i < count; i++) {
    const input = document.createElement("input");
    input.placeholder = "Personnage " + (i + 1);

    input.oninput = function () {
      showSuggestions(input);
    };

    container.appendChild(input);
  }

  document.getElementById("step2").classList.add("hidden");
  document.getElementById("step3").classList.remove("hidden");
}

// 🔎 autocomplete simple
function showSuggestions(input) {
  const value = input.value.toLowerCase();

  const match = characters.filter(c =>
    c.toLowerCase().startsWith(value)
  );

  console.log(match); // simple debug (améliorable UI)
}

function submitTags() {
  const inputs = document.querySelectorAll("#inputs input");

  let tags = [];

  inputs.forEach(i => {
    if (i.value.trim() !== "") {
      tags.push(i.value.trim());
    }
  });

  fetch("/tag", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      image_id: currentImage.id,
      tags: tags.join(";")   // 👈 IMPORTANT pour Excel
    })
  }).then(() => {
    alert("Envoyé !");
    location.reload();
  });
}

</script>

</body>
</html>
